name: ci

on:
  push:
    branches: [master]
    paths:
      - .agents/skills/overlay-tools/**
      - .github/workflows/ci.yml
      - .pre-commit-config.yaml
  pull_request:
    branches: [master]
    paths:
      - .agents/skills/overlay-tools/**
      - .github/workflows/ci.yml
      - .pre-commit-config.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay-tools:
    name: overlay-tools (ruff, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            .agents/skills/overlay-tools/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync overlay-tools dev dependencies
        working-directory: .agents/skills/overlay-tools
        run: uv sync --group dev

      - name: ruff check
        working-directory: .agents/skills/overlay-tools
        run: uv run ruff check .

      - name: ruff format
        working-directory: .agents/skills/overlay-tools
        run: uv run ruff format --check .

      - name: ty
        working-directory: .agents/skills/overlay-tools
        run: uv run ty check src autopilot

      - name: pytest
        working-directory: .agents/skills/overlay-tools
        run: uv run pytest -q
