name: ci

on:
  push:
    branches: [master]
    paths:
      - .agents/skills/overlay-tools/**
      - .github/workflows/ci.yml
      - .pre-commit-config.yaml
      - '*/*/*.ebuild'
      - '*/*/Manifest'
      - '*/*/metadata.xml'
      - '*/*/files/**'
      - metadata/md5-cache/**
      - metadata/layout.conf
      - profiles/**
      - eclass/**
  pull_request:
    branches: [master]
    paths:
      - .agents/skills/overlay-tools/**
      - .github/workflows/ci.yml
      - .pre-commit-config.yaml
      - '*/*/*.ebuild'
      - '*/*/Manifest'
      - '*/*/metadata.xml'
      - '*/*/files/**'
      - metadata/md5-cache/**
      - metadata/layout.conf
      - profiles/**
      - eclass/**

concurrency:
  # Each push owns its before..tip diff; later pushes must not replace its run.
  # PR runs still supersede earlier runs for the same pull-request ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  overlay-tools:
    name: overlay-tools (ruff, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            .agents/skills/overlay-tools/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync overlay-tools dev dependencies
        working-directory: .agents/skills/overlay-tools
        run: uv sync --group dev

      - name: ruff check
        working-directory: .agents/skills/overlay-tools
        run: uv run ruff check .

      - name: ruff format
        working-directory: .agents/skills/overlay-tools
        run: uv run ruff format --check .

      - name: ty
        working-directory: .agents/skills/overlay-tools
        run: uv run ty check src autopilot

      - name: pytest
        working-directory: .agents/skills/overlay-tools
        run: uv run pytest -q

      - name: Read-only QA for changed packages
        shell: bash
        env:
          QA_EVENT_NAME: ${{ github.event_name }}
          QA_PR_BASE: ${{ github.event.pull_request.base.sha }}
          QA_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$QA_EVENT_NAME" in
            pull_request) base="$QA_PR_BASE" ;;
            push) base="$QA_PUSH_BEFORE" ;;
            *) printf '::error::Unsupported QA event\n' >&2; exit 2 ;;
          esac
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Missing or invalid QA base SHA\n' >&2
            exit 2
          fi
          if [[ "$QA_EVENT_NAME" == push && "$base" == 0000000000000000000000000000000000000000 ]]; then
            .agents/skills/overlay-tools/bin/qa-ebuild-check --overlay-path "$PWD" --initial
          else
            .agents/skills/overlay-tools/bin/qa-ebuild-check --overlay-path "$PWD" --changed-since "$base"
          fi
